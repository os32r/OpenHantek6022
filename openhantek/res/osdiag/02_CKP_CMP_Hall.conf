; OSDiag - preset automotriz para OpenHantek6022 (Hantek 6022BE/BL)
; Correlacion CKP + CMP (Hall 0-5/12 V)
; Conexion: CH1 = CKP, CH2 = CMP, ambas puntas en x10. Dispara con el flanco de CMP. Verificar que el flanco de CMP caiga siempre en el mismo diente de CKP.

[OSDiag]
title="Correlacion CKP + CMP (Hall 0-5/12 V)"
guide="CH1 = CKP, CH2 = CMP, ambas puntas en x10. Dispara con el flanco de CMP. Verificar que el flanco de CMP caiga siempre en el mismo diente de CKP."

[configuration]
version=3

[scope]
horizontal\timebase=0.02
horizontal\maxTimebase=1
horizontal\format=0
trigger\mode=1
trigger\position=0.2
trigger\slope=0
trigger\source=1
trigger\smooth=0
voltage0\used=true
voltage0\gainStepIndex=3
voltage0\couplingOrMathIndex=0
voltage0\inverted=false
voltage0\offset=1.0
voltage0\trigger=2.5
voltage0\probeAttn=10.0
voltage1\used=true
voltage1\gainStepIndex=3
voltage1\couplingOrMathIndex=0
voltage1\inverted=false
voltage1\offset=-3.0
voltage1\trigger=2.5
voltage1\probeAttn=10.0
voltage2\used=false
voltage2\gainStepIndex=5
voltage2\couplingOrMathIndex=0
voltage2\inverted=false
voltage2\offset=0.0
voltage2\trigger=0.0
voltage2\probeAttn=1.0
spectrum0\used=false
spectrum1\used=false
spectrum2\used=false

[view]
digitalPhosphor=false
interpolation=1
