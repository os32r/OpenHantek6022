; OSDiag - preset automotriz para OpenHantek6022 (Hantek 6022BE/BL)
; Red CAN J1939 250 kbps (camiones y buses)
; Conexion: CH1 = CAN-H, CH2 = CAN-L (pines C/D del Deutsch 9 pines), puntas en x1. Mismos niveles que CAN estandar. MATH = CH1-CH2.

[OSDiag]
title="Red CAN J1939 250 kbps (camiones y buses)"
guide="CH1 = CAN-H, CH2 = CAN-L (pines C/D del Deutsch 9 pines), puntas en x1. Mismos niveles que CAN estandar. MATH = CH1-CH2."

[configuration]
version=3

[scope]
horizontal\timebase=2e-05
horizontal\maxTimebase=1
horizontal\format=0
trigger\mode=1
trigger\position=0.2
trigger\slope=0
trigger\source=0
trigger\smooth=0
voltage0\used=true
voltage0\gainStepIndex=4
voltage0\couplingOrMathIndex=0
voltage0\inverted=false
voltage0\offset=-3.0
voltage0\trigger=3.0
voltage0\probeAttn=1.0
voltage1\used=true
voltage1\gainStepIndex=4
voltage1\couplingOrMathIndex=0
voltage1\inverted=false
voltage1\offset=-3.0
voltage1\trigger=2.0
voltage1\probeAttn=1.0
voltage2\used=true
voltage2\gainStepIndex=4
voltage2\couplingOrMathIndex=1
voltage2\inverted=false
voltage2\offset=-4.0
voltage2\trigger=1.0
voltage2\probeAttn=1.0
spectrum0\used=false
spectrum1\used=false
spectrum2\used=false

[view]
digitalPhosphor=false
interpolation=1
